name: Gradle build and deploy with docker

on:
  workflow_dispatch:
  push:
    branches: [ "develop" ]
    
jobs:
  build:
    environment: dev
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set timezone to Korea
      uses: szenius/set-timezone@v2.0
      with:
        timezoneLinux: "Asia/Seoul"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      with:
        cache-write-only: true

    - name: Build with Gradle
      run: ./gradlew bootJar

    - name: Login to Docker Hub
      uses: docker/login-action@v3.5.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Get current date and time
      id: datetime
      run: |
        echo "datetime=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"    

    - name: Image build and push
      run: |
        docker build --build-arg PROFILE=dev -t ${{ secrets.DOCKER_HUB_NAMESPACE_EVENTTY_NG }}/${{ secrets.DOCKER_HUB_REPOSITORY_EVENTTY_NG }}-${{ steps.datetime.outputs.datetime }} --platform linux/arm64 .
        docker push ${{ secrets.DOCKER_HUB_NAMESPACE_EVENTTY_NG }}/${{ secrets.DOCKER_HUB_REPOSITORY_EVENTTY_NG }}:dev-${{ steps.datetime.outputs.datetime }}
