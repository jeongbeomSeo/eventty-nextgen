name: backend test for PR to develop

on:
  pull_request:
    branches: ["develop"]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read        # 코드 읽기
      pull-requests: write  # PR에 코멘트 달기 권한
      checks: write         # (필요하다면) 상태 검사 결과 업데이트 권한

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run tests and generate coverage report
      env:
        MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        DB_URL: ${{ secrets.DB_URL }}
        DB_DRIVER_CLASS_NAME: ${{ secrets.DB_DRIVER_CLASS_NAME }}
        DB_USER_NAME: ${{ secrets.DB_USER_NAME }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        GCP_SA_IMAGE_KEY: ${{ secrets.GCP_SA_IMAGE_KEY }}
      run: ./gradlew clean test jacocoTestReport -Dspring.profiles.active=local

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2.20.0
      if: always()
      with:
        files: ${{ github.workspace }}/**/build/test-results/**/*.xml

    - name: Comment test coverage on PR
      id: jacoco
      uses: madrapps/jacoco-report@v1.6.1
      with:
        title: 🎯 Test Coverage Report
        paths: ${{ github.workspace }}/**/build/reports/jacoco/test/jacocoTestReport.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 80
        min-coverage-changed-files: 80
        update-comment: true
        
