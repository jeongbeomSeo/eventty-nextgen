version: "3.8"

services:
  mysql:
    image: 'mysql:8.0.43'
    container_name: 'eventty-mysql'
    restart: always # 컨테이너를 수동으로 끄기전까지 항상 재시작 (no, always, on-failure)
    ports:
      - "13306:3306"
    volumes:
      # 로컬저장경로:도커저장경로 / 컨테이너 종료 후에도 데이터를 로컬에 저장하여 유지 (로컬 경로변경it  가능)
      - ./database/mysql/data:/var/lib/mysql
      # 로컬저장경로:도커저장경로 / 해당 경로에 작성된 DDL을 컨테이너 생성 시 자동실행 (.sql .sh 파일 실행) (로컬 경로변경 가능)
      - ./database/mysql/init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: eventty_nextgen
      MYSQL_USER: mysql1234
      MYSQL_PASSWORD: mysql1234
      TZ: Asia/Seoul